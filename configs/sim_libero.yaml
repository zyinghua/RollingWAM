# @package _global_

defaults:
  - train
  - override /task: libero_rolling_2cam224_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  task_suite_name: libero_spatial
  task_id: 0
  num_trials: 50
  output_dir: ./evaluate_results/libero/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Runtime behavior; rolling executes one full action chunk per replan
  env_num: 1
  num_steps_wait: 30
  binarize_gripper: true

  # Action inference
  num_inference_steps: 10  # must be divisible by model.rolling.window_blocks
  text_cfg_scale: 1.0
  negative_prompt: ""

  # Optional external inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  create_only: false
  task_file: null
  task_suite_names:
    - libero_10
    - libero_goal
    - libero_spatial
    - libero_object
  num_gpus: 8
  max_tasks_per_gpu: 2

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
