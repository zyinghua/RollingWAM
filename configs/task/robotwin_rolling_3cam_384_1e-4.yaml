# @package _global_

defaults:
  - override /data: robotwin
  - override /model: rollingwam
  - _self_

# dataloading
batch_size: 8
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false

data:
  train:
    # raw steps for the model window: ratio * 4 (VAE temporal factor) * chunk_latents * W + 1
    num_frames: ${eval:'${data.train.action_video_freq_ratio} * 4 * ${model.rolling.chunk_latents} * ${model.rolling.window_blocks} + 1'}
  val:
    num_frames: ${data.train.num_frames}

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 2500
eval_every: 2500

# training
gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: null
