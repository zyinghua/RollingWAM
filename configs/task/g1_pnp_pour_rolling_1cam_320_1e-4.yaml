# @package _global_

defaults:
  - override /data: g1_pnp_pour_v30
  - override /model: rollingwam
  - _self_

batch_size: 8
num_workers: 4

model:
  mot_checkpoint_mixed_attn: true
  rolling:
    window_blocks: 3
    chunk_latents: 4

data:
  train:
    # Derive the sequence length from the temporal and rolling-window geometry.
    num_frames: ${eval:'${data.train.action_video_freq_ratio} * 4 * ${model.rolling.chunk_latents} * ${model.rolling.window_blocks} + 1'}
  val: null

lr_scheduler_type: cosine
learning_rate: 1e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 666
eval_every: 0
eval_num_inference_steps: 10

gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: null

wandb:
  enabled: true
  mode: offline
