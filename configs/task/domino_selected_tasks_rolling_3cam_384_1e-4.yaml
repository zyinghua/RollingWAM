# @package _global_

defaults:
  - override /data: domino_selected_tasks
  - override /model: rollingwam
  - _self_

batch_size: 8
num_workers: 4

model:
  mot_checkpoint_mixed_attn: false

data:
  train:
    num_frames: ${eval:'${data.train.action_video_freq_ratio} * 4 * ${model.rolling.chunk_latents} * ${model.rolling.window_blocks} + 1'}
  val:
    num_frames: ${data.train.num_frames}

lr_scheduler_type: cosine
learning_rate: 1e-4
num_epochs: 4
max_steps: null
log_every: 10
save_every: 200
eval_every: 200

gradient_accumulation_steps: 2
weight_decay: 1e-2
resume: null
