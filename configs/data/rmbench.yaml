defaults:
  - robotwin
  - _self_

# RMBench (memory-dependent RoboTwin-2.0 tasks), converted per task with
# tools/rmbench/raw_to_lerobot.py: same aloha-agilex embodiment and camera set
# as RoboTwin, but native 240x320 videos, fps 15, and 14-dim absolute joint
# state/action from joint_action/vector (matching the qpos deploy path).
dataset_root: /datasets/RMBench-data/data/rollingwam-rmbench
text_embedding_cache_dir: ${data.dataset_root}/text_embeds_cache
dataset_dirs:
  - ${data.dataset_root}/observe_and_pickup
  - ${data.dataset_root}/rearrange_blocks
  - ${data.dataset_root}/put_back_block
  - ${data.dataset_root}/swap_blocks
  - ${data.dataset_root}/swap_T
  - ${data.dataset_root}/battery_try
  - ${data.dataset_root}/blocks_ranking_try
  - ${data.dataset_root}/cover_blocks
  - ${data.dataset_root}/press_button

shape_meta:
  images:
    - key: cam_high
      raw_shape: [3, 240, 320]
      shape: [3, 240, 320]
    - key: cam_left_wrist
      raw_shape: [3, 240, 320]
      shape: [3, 240, 320]
    - key: cam_right_wrist
      raw_shape: [3, 240, 320]
      shape: [3, 240, 320]
  action:
    - key: default
      raw_shape: 14 # before transform
      shape: 14 # after transform
  state:
    - key: default
      raw_shape: 14 # before transform
      shape: 14 # after transform

train:
  dataset_dirs: ${data.dataset_dirs}
  shape_meta: ${data.shape_meta}
  # Only 50 episodes per task: train on all of them.
  val_set_proportion: 0.0
  # Compute normalization statistics from the converted tasks on the first run.
  pretrained_norm_stats: null
  text_embedding_cache_dir: ${data.text_embedding_cache_dir}

val:
  dataset_dirs: ${data.dataset_dirs}
  shape_meta: ${data.shape_meta}
  # Small monitoring split; overlaps the training episodes by design.
  val_set_proportion: 0.01
  # The runtime reuses the statistics generated by the training dataset.
  pretrained_norm_stats: null
  text_embedding_cache_dir: ${data.text_embedding_cache_dir}
