# @package _global_

defaults:
  - train
  - override /task: rmbench_rolling_3cam_384_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  rmbench_root: third_party/RMBench
  policy_name: rollingwam_policy
  task_name: null
  task_config: demo_clean  # RMBench's official evaluation setting
  instruction_type: unseen
  eval_num_episodes: 100
  output_dir: ./evaluate_results/rmbench/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  num_inference_steps: 10  # must be divisible by model.rolling.window_blocks
  text_cfg_scale: 1.0
  negative_prompt: ""
  timing_enabled: false
  # False is the faithful RMBench setting. True skips redundant RGB rendering
  # while executing the remainder of an already-predicted action chunk.
  skip_get_obs_within_replan: false
  save_imagined_rollouts: false

  # Runtime inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  enabled: false
  num_gpus: 8
  # Each worker loads its own 5B policy, so one worker per GPU is the safe default.
  max_tasks_per_gpu: 1

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
