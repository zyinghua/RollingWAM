# SageMaker target for LeRobot v3 G1 datasets.

task: g1_rolling_1cam_320_1e-4

instance_count: 1
queue: cv-spot

channels:
  # Holds bottle/ dog/ plate/ pour/ text_embeds_cache/ — the layout
  # configs/data/g1_lerobot_v3.yaml derives dataset_dirs and
  # text_embedding_cache_dir from, via the data.dataset_root override below.
  # File mode, not FastFile: the whole set is ~410 MB in 33 objects, so the
  # up-front download is seconds and every read is local afterwards, while a
  # lazily mounted prefix would pay per-object latency on each access.
  g1:
    s3: s3://tri-ml-sandbox-16011-us-west-2-datasets/junjie/data/lerobotv3/self_collected
    mode: File
    distribution: FullyReplicated
  pretrained:
    s3: s3://tri-ml-sandbox-16011-us-west-2-datasets/junjie/fastwam/checkpoints
    mode: File
    distribution: FullyReplicated

env:
  DIFFSYNTH_MODEL_BASE_PATH: "{channel:pretrained}"
  DIFFSYNTH_SKIP_DOWNLOAD: "true"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: "/opt/ml/hf_cache"
  HF_DATASETS_CACHE: "/opt/ml/hf_cache/datasets"
  TORCH_HOME: "/opt/ml/torch_cache"

overrides:
  - "data.dataset_root={channel:g1}"
  - "model.action_dit_pretrained_path={channel:pretrained}/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt"
  - "output_dir={checkpoint_dir}/{task}"
  - "wandb.name={job}"
