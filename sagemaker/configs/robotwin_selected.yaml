# SageMaker target: RollingWAM selected-tasks RoboTwin — the W-ablation config
# (configs/task/robotwin_selected_tasks_rolling_3cam_384_1e-4.yaml, 6 tasks).
#
# One W per job on ONE node (8 GPUs). The task yaml's batch_size=8 x
# grad_accum=2 x 8 = effective 128, matching the DGX ablation, so a run only
# needs W and its denoising-step count:
#
#   bash sagemaker/run_sm.sh robotwin_selected 1 w5 \
#       model.rolling.window_blocks=5 eval_num_inference_steps=15
#
# instance_count stays 1 deliberately: at 4 nodes those same yaml defaults would
# give 8 x 2 x 32 = 512 effective, four times the DGX runs. Multi-node also
# needs `~data.val` (see the stats note below).
#
# ############################################################################
# # TASK LABELS — nothing to upload. Selected-tasks mode labels each episode  #
# # by intersecting its prompt hash against the set of cache filenames        #
# # belonging to each task, so it needs a per-task VIEW of the cache.         #
# #                                                                           #
# # Instead of per-task directories on S3 (tens of thousands of small objects #
# # walked at startup over a FastFile mount), the labels live in the repo at  #
# #   configs/data/robotwin_selected_tasks_text_embeds_cache_index.json       #
# # which is baked into the image, and entry.py rebuilds the directory view   #
# # locally as symlinks into the flat trimmed cache mount.                    #
# #                                                                           #
# # Regenerate it on the training box whenever `selected_task_names` changes  #
# # (then rebuild the image so the new file is baked in):                     #
# #                                                                           #
# #   python3 sagemaker/tools/make_task_index.py \                            #
# #       --cache-root /datasets/robotwin2.0-fastwam/text_embeds_cache \      #
# #       --tasks lift_pot beat_block_hammer place_dual_shoes \               #
# #               stack_bowls_two blocks_ranking_size stack_blocks_three      #
# ############################################################################
#
# ############################################################################
# # NORMALIZATION STATS are computed on the fly from the 6 selected tasks,    #
# # exactly as on the DGX (pretrained_norm_stats stays null).                 #
# #                                                                           #
# # THIS ONLY WORKS ON A SINGLE NODE. Rank 0 computes the stats and           #
# # broadcasts them in memory for the TRAIN set, but runtime.build_datasets   #
# # then hands the VAL set the path <output_dir>/dataset_stats.json, which    #
# # every rank reads from its own local disk. Only algo-1 wrote that file,    #
# # and SageMaker has no shared filesystem, so algo-2+ raise FileNotFound.    #
# #                                                                           #
# # For more than one node, add `~data.val` to the submit command — val then  #
# # falls back to the train dataset, whose stats are already in memory, so no #
# # file is read (the 2 monitoring val episodes overlap train anyway).        #
# ############################################################################
#
# Placeholders are expanded INSIDE the container by sagemaker/entry.py:
#   {channel:NAME}   -> /opt/ml/input/data/NAME
#   {checkpoint_dir} -> /opt/ml/checkpoints   (SageMaker syncs it to checkpoint_s3_uri)
#   {task}           -> the Hydra task name
#   {job}            -> the SageMaker training job name

task: robotwin_selected_tasks_rolling_3cam_384_1e-4

instance_count: 1
queue: cv-spot

channels:
  # Full dataset mirror on a File channel (see robotwin_full.yaml for the
  # rationale). Selected-tasks mode still needs the COMPLETE meta/ (episode
  # selection verifies the 27,500-episode layout) even though only 300 episodes
  # are read, so the full mirror is mounted, not a subset.
  robotwin:
    s3: s3://tri-ml-sandbox-16011-us-west-2-datasets/junjie/data/robotwin2.0-fastwam/robotwin2.0
    mode: File
    distribution: FullyReplicated
  text_cache:
    s3: s3://tri-ml-sandbox-16011-us-west-2-datasets/junjie/data/robotwin2.0-fastwam/text_embeds_cache_trimmed
    mode: FastFile
    distribution: FullyReplicated
  pretrained:
    s3: s3://tri-ml-sandbox-16011-us-west-2-datasets/junjie/fastwam/checkpoints
    mode: File
    distribution: FullyReplicated

env:
  DIFFSYNTH_MODEL_BASE_PATH: "{channel:pretrained}"
  DIFFSYNTH_SKIP_DOWNLOAD: "true"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: "/opt/ml/hf_cache"
  HF_DATASETS_CACHE: "/opt/ml/hf_cache/datasets"
  TORCH_HOME: "/opt/ml/torch_cache"
  ROLLINGWAM_SM_TASK_INDEX: "configs/data/robotwin_selected_tasks_text_embeds_cache_index.json"
  ROLLINGWAM_SM_TASK_CACHE_SRC: "{channel:text_cache}"
  ROLLINGWAM_SM_TASK_CACHE_DST: "/opt/ml/task_cache"

overrides:
  # The subclass is optional in selected-tasks mode (the per-task index path
  # never mkdirs), but selecting it keeps the read path uniform and accepts
  # trimmed per-task caches too.
  - "data.train._target_=rollingwam_sm.dataset.TrimmedTextCacheRobotVideoDataset"
  - "data.val._target_=rollingwam_sm.dataset.TrimmedTextCacheRobotVideoDataset"
  # robotwin_selected_tasks.yaml routes everything through these two roots
  # (${data.dataset_root} / ${data.text_embedding_cache_root} interpolations),
  # so two overrides remap train+val dataset dirs, the membership index, and
  # the embed reads at once.
  # pretrained_norm_stats stays null: stats are computed from the 6 selected
  # tasks on first run, as on the DGX. Single node only — see the header.
  - "data.dataset_root={channel:robotwin}"
  - "data.text_embedding_cache_root=/opt/ml/task_cache"
  - "model.action_dit_pretrained_path={channel:pretrained}/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt"
  - "output_dir={checkpoint_dir}/{task}"
  - "wandb.name={job}"
