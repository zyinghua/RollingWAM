# SageMaker target: RollingWAM full RoboTwin (configs/task/robotwin_rolling_3cam_384_1e-4.yaml).
#
# Everything here is data for the launcher — no RollingWAM code is touched. The
# `overrides` are Hydra overrides appended to `scripts/train.py`; anything you
# pass on the launcher CLI wins over them (merged per key by sagemaker/entry.py).
#
# Placeholders are expanded INSIDE the container by sagemaker/entry.py:
#   {channel:NAME}   -> /opt/ml/input/data/NAME
#   {checkpoint_dir} -> /opt/ml/checkpoints   (SageMaker syncs it to checkpoint_s3_uri)
#   {pretrained_dir} -> /opt/ml/pretrained
#   {task}           -> the Hydra task name
#   {job}            -> the SageMaker training job name

task: robotwin_rolling_3cam_384_1e-4

# Node shape. `queue` resolves the instance type; `instance_type` overrides it.
instance_count: 1
queue: cv-spot

channels:
  # Channel split (validated by the FastWAM smoke run 2026-08-18 — RollingWAM's
  # vendored LeRobot loader is the same code):
  # LeRobotDataset.__init__ asserts `is_file()` on EVERY episode file and reads
  # all 27.5k parquets — ~110,000 metadata ops PER RANK (~880k per 8-GPU node).
  # Through a FastFile mount that stalled >90 min with no output, so the episode
  # data rides a File channel (~80 GB bulk download, then local metadata ops;
  # dataset init finishes in ~4 min). The ~315 GB trimmed text-embed cache stays
  # FastFile: it is only ever read per-sample by hash, never scanned.
  # These prefixes are the FastWAM mirrors of the SAME /datasets/robotwin2.0-fastwam
  # data RollingWAM trains on locally — reused as-is.
  robotwin:
    s3: s3://tri-ml-sandbox-16011-us-west-2-datasets/junjie/data/robotwin2.0-fastwam/robotwin2.0
    mode: File
    distribution: FullyReplicated
  stats:
    s3: s3://tri-ml-sandbox-16011-us-west-2-datasets/junjie/data/robotwin2.0-fastwam/dataset_stats.json
    mode: File
    distribution: FullyReplicated
  text_cache:
    s3: s3://tri-ml-sandbox-16011-us-west-2-datasets/junjie/data/robotwin2.0-fastwam/text_embeds_cache_trimmed
    mode: FastFile
    distribution: FullyReplicated
  # Wan2.2 / Wan2.1 / DiffSynth / ActionDiT weights. File mode (not FastFile):
  # these are read in full at startup, so a parallel up-front download beats
  # lazy per-read fetches.
  pretrained:
    s3: s3://tri-ml-sandbox-16011-us-west-2-datasets/junjie/fastwam/checkpoints
    mode: File
    distribution: FullyReplicated

env:
  # DiffSynth resolves Wan-AI/* and DiffSynth-Studio/* under this root, and
  # SKIP_DOWNLOAD keeps it from reaching out to modelscope inside the job.
  DIFFSYNTH_MODEL_BASE_PATH: "{channel:pretrained}"
  DIFFSYNTH_SKIP_DOWNLOAD: "true"
  TOKENIZERS_PARALLELISM: "false"
  # Building the LeRobot index makes `datasets` write an Arrow cache for all
  # 27.5k episode parquets. Keep it on the instance volume — NOT under
  # /opt/ml/checkpoints, which is continuously synced to S3.
  HF_HOME: "/opt/ml/hf_cache"
  HF_DATASETS_CACHE: "/opt/ml/hf_cache/datasets"
  TORCH_HOME: "/opt/ml/torch_cache"

overrides:
  # Swap in the bolt-on dataset subclass (sagemaker/rollingwam_sm/dataset.py):
  # it reads the padding-trimmed text-embed cache AND skips the stock mkdir on
  # the cache dir, which a read-only FastFile mount rejects. It also accepts the
  # stock padded layout. src/rollingwam is untouched; sagemaker/entry.py puts
  # `rollingwam_sm` on PYTHONPATH.
  - "data.train._target_=rollingwam_sm.dataset.TrimmedTextCacheRobotVideoDataset"
  - "data.val._target_=rollingwam_sm.dataset.TrimmedTextCacheRobotVideoDataset"
  - "data.train.dataset_dirs=[{channel:robotwin}]"
  - "data.val.dataset_dirs=[{channel:robotwin}]"
  - "data.train.pretrained_norm_stats={channel:stats}/dataset_stats.json"
  - "data.val.pretrained_norm_stats={channel:stats}/dataset_stats.json"
  - "data.train.text_embedding_cache_dir={channel:text_cache}"
  - "data.val.text_embedding_cache_dir={channel:text_cache}"
  # configs/model/rollingwam.yaml's repo-root-relative default would point into
  # the image checkout, where checkpoints/ is dockerignored — use the channel.
  - "model.action_dit_pretrained_path={channel:pretrained}/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt"
  # Everything the trainer writes (weights, deepspeed state, eval videos,
  # dataset_stats.json, config.yaml, offline wandb) lands under output_dir -> S3.
  - "output_dir={checkpoint_dir}/{task}"
  - "wandb.name={job}"
