# SageMaker target: RollingWAM on LIBERO — all four suites trained together
# (configs/task/libero_rolling_2cam224_1e-4.yaml).
#
#   bash sagemaker/run_sm.sh libero 1 libero-run
#
# Simpler than the RoboTwin targets in three ways, all consequences of the data
# config having no `val:` block (configs/data/libero_2cam.yaml defines `train`
# only):
#   * runtime.build_datasets takes `val_ds = train_ds`, so no dataset_stats.json
#     is ever READ from disk — normalization is computed on the fly and stays in
#     memory. That works at ANY node count; no stats channel, no `~data.val`.
#   * no per-task cache layout: LIBERO uses the flat hash-addressed cache, so
#     there is no task index and no symlink bridge.
#   * training imports nothing from the LIBERO simulator (the LiberoTransform
#     line in the data config is commented out), so the stock image is enough —
#     mujoco is only needed for policy evaluation.
#
# ############################################################################
# # PREREQUISITE — both prefixes below must be uploaded; unlike RoboTwin,     #
# # FastWAM mirrored no LIBERO data to S3.                                    #
# #                                                                           #
# # 1. The four converted suite datasets (from HF `yuanty/LIBERO-fastwam`,    #
# #    living at ./data/libero_mujoco3.3.2/ on the training box):             #
# #                                                                           #
# #   aws s3 cp --recursive ./data/libero_mujoco3.3.2 \                       #
# #     s3://tri-ml-sandbox-16011-us-west-2-datasets/junjie/data/libero_mujoco3.3.2
# #                                                                           #
# # 2. The text-embed cache, after running                                     #
# #    scripts/libero/precompute_libero_text_embeds.sh on the training box:   #
# #                                                                           #
# #   aws s3 cp --recursive ./data/text_embeds_cache/libero \                 #
# #     s3://tri-ml-sandbox-16011-us-west-2-datasets/junjie/data/text_embeds_cache/libero
# ############################################################################
#
# Placeholders are expanded INSIDE the container by sagemaker/entry.py:
#   {channel:NAME}   -> /opt/ml/input/data/NAME
#   {checkpoint_dir} -> /opt/ml/checkpoints   (SageMaker syncs it to checkpoint_s3_uri)
#   {task}           -> the Hydra task name
#   {job}            -> the SageMaker training job name

task: libero_rolling_2cam224_1e-4

# batch_size 16 x grad_accum 1 x 8 GPUs = 128 effective (the task yaml's values).
instance_count: 1
queue: cv-spot

channels:
  # File mode, as for RoboTwin: LeRobotDataset.__init__ stats every episode file
  # and load_dataset reads every parquet, which is a metadata storm on a lazily
  # mounted prefix. LIBERO is far smaller than RoboTwin, so the up-front
  # download is short.
  libero:
    s3: s3://tri-ml-sandbox-16011-us-west-2-datasets/junjie/data/libero_mujoco3.3.2
    mode: File
    distribution: FullyReplicated
  # Flat, hash-addressed, and small (one file per distinct instruction), so
  # File mode beats FastFile here — it is local from the first read on.
  text_cache:
    s3: s3://tri-ml-sandbox-16011-us-west-2-datasets/junjie/data/text_embeds_cache/libero
    mode: File
    distribution: FullyReplicated
  # Wan2.2 / Wan2.1 / DiffSynth / ActionDiT weights — the same mirror the
  # RoboTwin targets use; the model is identical.
  pretrained:
    s3: s3://tri-ml-sandbox-16011-us-west-2-datasets/junjie/fastwam/checkpoints
    mode: File
    distribution: FullyReplicated

env:
  DIFFSYNTH_MODEL_BASE_PATH: "{channel:pretrained}"
  DIFFSYNTH_SKIP_DOWNLOAD: "true"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: "/opt/ml/hf_cache"
  HF_DATASETS_CACHE: "/opt/ml/hf_cache/datasets"
  TORCH_HOME: "/opt/ml/torch_cache"

overrides:
  # The bolt-on subclass skips the stock reader's mkdir on the cache dir (a
  # mounted channel may be read-only) and accepts padded or trimmed files.
  # Only `train` exists in this data config — there is no data.val to override.
  - "data.train._target_=rollingwam_sm.dataset.TrimmedTextCacheRobotVideoDataset"
  - "data.train.dataset_dirs=[{channel:libero}/libero_spatial_no_noops_lerobot,{channel:libero}/libero_object_no_noops_lerobot,{channel:libero}/libero_goal_no_noops_lerobot,{channel:libero}/libero_10_no_noops_lerobot]"
  - "data.train.text_embedding_cache_dir={channel:text_cache}"
  - "model.action_dit_pretrained_path={channel:pretrained}/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt"
  - "output_dir={checkpoint_dir}/{task}"
  - "wandb.name={job}"
